name: Vestaboard Note Daily Routine

on:
  schedule:
    # Runs every 15 minutes at off-peak minutes (:07, :22, :37, :52)
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      module:
        description: 'Specific module to run (or leave empty to obey routine schedule)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - 'weather'
          - 'subway_status'
          - 'subway_countdown'
          - 'markets'
          - 'sports'
      team:
        description: 'Sports team code'
        required: false
        default: 'BUF'
        type: choice
        options:
          - 'BUF'
          - 'NYJ'
          - 'NYG'

jobs:
  run-routine:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run controller
        env:
          VESTABOARD_READ_WRITE_KEY: ${{ secrets.VESTABOARD_READ_WRITE_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.module }}" ]; then
            python vestaboard_controller.py --module ${{ github.event.inputs.module }} --team ${{ github.event.inputs.team }}
          else
            python vestaboard_controller.py --routine
          fi
